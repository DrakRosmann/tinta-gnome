[workspace]
members = ["crates/tinta-core", "crates/tinta", "crates/tinta-vkbd", "crates/tinta-xptr"]
default-members = ["crates/tinta-core", "crates/tinta"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/DrakRosmann/tinta-gnome"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = "1"

# Dependencies stay usable in debug builds: highlighting and rendering are slow otherwise.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.tinta-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
