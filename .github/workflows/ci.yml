# Testa o núcleo e a interface (sem janela) a cada push e pull request.
# Num contêiner Fedora: o libadwaita do Ubuntu ainda é antigo demais (o app pede o 1.7).
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 45
    steps:
      - name: Ferramentas, bibliotecas e um servidor de linguagem e depuradores para os testes
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc pkgconf-pkg-config cargo rust \
            gtk4-devel libadwaita-devel vte291-gtk4-devel clang-tools-extra gdb python3-pip procps-ng
          dnf install -y --skip-unavailable google-noto-sans-mono-fonts
          # O Fedora não empacota o debugpy.
          pip install --break-system-packages debugpy

      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fedora-${{ hashFiles('Cargo.lock') }}

      - name: Git com identidade para os testes
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Testes do núcleo
        run: cargo test -p tinta-core

      - name: Testes da interface
        run: cargo test -p tinta-gnome

      - name: Compila tudo
        run: cargo build --workspace
