# Testa o núcleo e a interface (sem janela) a cada push e pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Bibliotecas do sistema e um servidor de linguagem para os testes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb python3-debugpy \
            cmake pkg-config libxkbcommon-dev libwayland-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev clangd fonts-noto-mono fonts-noto-core

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Git com identidade para os testes
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com

      - name: Testes do núcleo
        run: cargo test -p tinta-core

      - name: Testes da interface
        run: cargo test -p tinta-gnome

      - name: Compila tudo
        run: cargo build --workspace
