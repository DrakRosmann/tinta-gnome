[package]
name = "tinta-core"
description = "Text engine of the Tinta editor: buffers, cursors, undo, syntax, search, git and LSP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
regex.workspace = true
syntect = { version = "5", default-features = false, features = ["default-onig", "plist-load", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
ignore = "0.4"
nucleo-matcher = "0.3"
similar = "2"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
