[package]
name = "tinta-gnome"
description = "Code editor for GNOME, in GTK 4 and libadwaita"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tinta-gnome"
path = "src/main.rs"

[dependencies]
tinta-core = { path = "../tinta-core" }
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
regex.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
vte = { package = "vte4", version = "0.10", features = ["v0_80"] }
async-channel = "2"
notify = "8"
futures = "0.3"
pulldown-cmark = "0.13"
open = "5"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
trash = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"
syntect = { version = "5", default-features = false }
