[package]
name = "tinta-gnome"
description = "Code editor for the COSMIC desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tinta-gnome"
path = "src/main.rs"

[dependencies]
tinta-core = { path = "../tinta-core" }
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
regex.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "dbus-config", "multi-window", "tokio", "wayland", "winit", "wgpu", "x11", "a11y", "xdg-portal",
] }
alacritty_terminal = "0.25"
notify = "8"
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures = "0.3"
pulldown-cmark = "0.13"
open = "5"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
trash = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"
syntect = { version = "5", default-features = false }

[dev-dependencies]
iced_runtime = { git = "https://github.com/pop-os/libcosmic" }
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic" }
